# Applies only to XDG_CURRENT_DESKTOP=niri. Keep Hyprland's routing separate.
[preferred]
# GTK handles file/directory dialogs, opening apps, printing and settings.
# The GNOME backend may be deliberately masked on the Hyprland host.
default=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.AppChooser=gtk;
org.freedesktop.impl.portal.Settings=gtk;
# Compositor-specific capture still requires the GNOME backend under Niri.
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;
org.freedesktop.impl.portal.Secret=gnome-keyring;
